<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The only Christmas list you need this year | Moms Who Claude</title>
<meta name="description" content="A free Christmas gift from me to you. One prompt, about 10 minutes, and your family stops texting you what the kids want.">
<meta property="og:title" content="The only Christmas list you need this year">
<meta property="og:description" content="A free Christmas gift from me to you. One prompt, about 10 minutes, and your family stops texting you what the kids want.">
<meta property="og:image" content="https://www.momswhoclaude.ai/gifts-og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --plum:#1F1418; --berry:#3A1F2E; --rose:#C45E7E; --rose-light:#D4849A; --blush:#F3E8E4; --cream:#F5ECE8; --ink:#2A1820; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; min-height:100dvh; background: radial-gradient(80% 60% at 50% 30%, #5A2B42 0%, var(--berry) 70%); color:var(--cream); font-family:'Montserrat',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 20px 36px; text-align:center; position:relative; overflow-x:hidden; }
  .garland{ position:absolute; top:0; left:0; width:100%; height:56px; pointer-events:none; }
  .wrap{ width:100%; max-width:520px; position:relative; z-index:1; }
  .eyebrow{ font-weight:700; font-size:.78rem; letter-spacing:.24em; text-transform:uppercase; color:var(--rose-light); margin:0 0 14px; }
  h1{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:clamp(2.5rem,11vw,3.4rem); line-height:1.04; margin:0 0 .4em; color:var(--cream); }
  h1 em{ color:var(--rose); font-style:italic; }
  p{ font-size:1.15rem; line-height:1.55; margin:0 0 1em; }
  form{ display:grid; gap:12px; margin-top:22px; }
  input[type=email]{ width:100%; padding:18px 22px; border-radius:999px; border:1px solid var(--rose-light); background:var(--cream); color:var(--ink); font:500 1.15rem 'Montserrat',sans-serif; }
  input[type=email]::placeholder{ color:#7a6068; }
  button.big{ width:100%; padding:18px 24px; border-radius:999px; border:0; background:var(--rose); color:#fff; font:700 1.15rem 'Montserrat',sans-serif; cursor:pointer; }
  button.big:disabled{ opacity:.7; }
  .small{ font-size:1.05rem; opacity:.92; margin:14px 0 0; line-height:1.5; }
  .box{ text-align:left; background:var(--cream); color:var(--ink); border-radius:16px; padding:18px 18px; font-size:1rem; line-height:1.5; max-height:34vh; overflow:auto; border-left:5px solid var(--rose); margin:18px 0 14px; }
  .steps{ text-align:left; list-style:none; padding:0; margin:20px 0 0; display:grid; gap:10px; font-size:1.1rem; }
  .steps b{ color:var(--rose-light); }
  a{ color:var(--rose-light); }
  .cursor{ display:inline-block; width:.05em; height:.72em; background:var(--rose); margin-left:.1em; }
  :focus-visible{ outline:3px solid var(--rose-light); outline-offset:2px; }
</style>
</head>
<body>
<svg class="garland" viewBox="0 0 1200 56" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><path d="M-10 4 Q150 46 300 4 T600 4 T900 4 T1210 4" fill="none" stroke="#D4849A" stroke-opacity=".8" stroke-width="1.5"/><circle cx="150" cy="26" r="8" fill="#C45E7E"/><circle cx="450" cy="26" r="8" fill="#D4849A"/><circle cx="750" cy="26" r="8" fill="#F3E8E4"/><circle cx="1050" cy="26" r="8" fill="#C45E7E"/></svg>
<div class="wrap">

  <p class="eyebrow">A Christmas gift from me to you</p>
  <h1>The <em>only</em> Christmas list you need this year.<span class="cursor" aria-hidden="true"></span></h1>
  <p>One prompt. About 10 minutes. Then the family opens one link instead of asking you “what do the kids want?”</p>
  <form id="f" action="https://app.kit.com/forms/10078395/subscriptions" method="post" data-uid="b911227d18">
    <label for="em" style="position:absolute;left:-9999px">Email</label>
    <input id="em" type="email" name="email_address" placeholder="Your email" autocomplete="email" inputmode="email" required>
    <button class="big" type="submit">Send me the gift</button>
  </form>
  <p class="small">Free. No app to download. I'll show you the prompt on the next screen and email it too.</p>
<script>
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = f.querySelector('button');
    b.disabled = true; b.textContent = 'One sec\u2026';
    fetch(f.action, { method: 'POST', headers: { 'Accept': 'application/json' }, body: new URLSearchParams(new FormData(f)) })
      .then(function (r) { return r.json(); })
      .then(function () { location.href = 'gifts-thanks.html'; })
      .catch(function () { b.disabled = false; b.textContent = 'Send me the gift'; alert('That didn\'t go through. Try once more?'); });
  });
</script>
</div>
</body>
</html>
